name: VPS build and release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Build only, deploy this main revision, or roll back to previous release
        type: choice
        options: [build, deploy, rollback]
        default: build

# Do not cancel an SSH release halfway through a proxy switch.
concurrency:
  group: woyab-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event.inputs.action != 'rollback'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      frontend: ${{ steps.frontend.outputs.digest }}
      api: ${{ steps.api.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test deployment controller
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test both applications
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          target: verification
          push: false
          build-args: |
            APP_REVISION=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha,scope=woyab
          cache-to: type=gha,mode=max,scope=woyab
      - name: Publish API
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          target: api
          push: true
          tags: ghcr.io/mohi-az/fargo-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mohi-az/fargo
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=woyab
      - name: Publish frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          target: frontend
          push: true
          tags: ghcr.io/mohi-az/fargo-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mohi-az/fargo
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_REVISION=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha,scope=woyab
      - name: Record immutable release references
        env:
          FRONTEND: ${{ steps.frontend.outputs.digest }}
          API: ${{ steps.api.outputs.digest }}
        run: |
          printf 'Revision: `%s`\n\nFrontend: `ghcr.io/mohi-az/fargo-frontend@%s`\n\nAPI: `ghcr.io/mohi-az/fargo-api@%s`\n' "$GITHUB_SHA" "$FRONTEND" "$API" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.VPS_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || github.event.inputs.action == 'deploy')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Deploy the validated pair over restricted SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          FRONTEND: ${{ needs.build.outputs.frontend }}
          API: ${{ needs.build.outputs.api }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/woyab-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/woyab-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/woyab-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/woyab-ssh/key" "$RUNNER_TEMP/woyab-ssh/known_hosts"
          ssh -T -i "$RUNNER_TEMP/woyab-ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/woyab-ssh/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 woyab-deploy@191.96.94.70 "deploy $GITHUB_SHA ghcr.io/mohi-az/fargo-frontend@$FRONTEND ghcr.io/mohi-az/fargo-api@$API $GITHUB_RUN_NUMBER"

  rollback:
    if: github.ref == 'refs/heads/main' && vars.VPS_DEPLOY_ENABLED == 'true' && github.event.inputs.action == 'rollback'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Roll back to the previous validated pair
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/woyab-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/woyab-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/woyab-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/woyab-ssh/key" "$RUNNER_TEMP/woyab-ssh/known_hosts"
          ssh -T -i "$RUNNER_TEMP/woyab-ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/woyab-ssh/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 woyab-deploy@191.96.94.70 "rollback $GITHUB_RUN_NUMBER"
