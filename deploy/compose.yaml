services:
  api:
    image: ${API_IMAGE:?immutable API digest required}
    init: true
    restart: unless-stopped
    env_file:
      - path: /opt/woyab/env/api.env
        format: raw
    environment:
      NODE_ENV: production
      # Reserve cgroup memory for Prisma/pg, native buffers and health probes.
      NODE_OPTIONS: --max-old-space-size=96
      MALLOC_ARENA_MAX: '2'
      PORT: '4000'
      APP_REVISION: ${APP_REVISION:?release SHA required}
      DB_POOL_MAX: '5'
      TRUST_PROXY_HOPS: '1'
      CORS_ORIGIN: https://woyab.com
      GOOGLE_PHOTO_CACHE_DIR: /data/google-photo-cache
    ports:
      - '127.0.0.1:${API_PORT:?slot API port required}:4000'
    volumes:
      - /opt/woyab/cache/google-photos:/data/google-photo-cache
    mem_limit: 256m
    memswap_limit: 256m
    stop_grace_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/v1/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
  frontend:
    image: ${FRONTEND_IMAGE:?immutable frontend digest required}
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: /opt/woyab/env/frontend.env
        format: raw
    environment:
      NODE_ENV: production
      # 160 MiB exhausted Next's JS heap in production. Leave native headroom
      # within the unchanged 512 MiB cgroup and keep image concurrency bounded.
      NODE_OPTIONS: --max-old-space-size=256
      MALLOC_ARENA_MAX: '2'
      UV_THREADPOOL_SIZE: '2'
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      APP_REVISION: ${APP_REVISION:?release SHA required}
      API_URL: http://api:4000
      DB_POOL_MAX: '5'
      BUSINESS_IMAGE_STORAGE_DIR: /data/business-images
    ports:
      - '127.0.0.1:${FRONTEND_PORT:?slot frontend port required}:3000'
    volumes:
      - /opt/woyab/media/business-images:/data/business-images
      - /opt/woyab/media/uploads:/app/apps/frontend/public/uploads
    mem_limit: 512m
    memswap_limit: 512m
    stop_grace_period: 30s
    logging: *logging
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
